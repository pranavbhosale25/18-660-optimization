[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-sr1-trust-region"
version = "0.3.0"
description = "JIT- and VMAP-oriented SR1 trust-region optimization in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Carnegie Mellon University"}]
dependencies = ["jax>=0.4.30"]
keywords = ["jax", "optimization", "trust-region", "sr1", "quasi-newton"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26"]
plot = ["matplotlib>=3.10", "numpy>=1.26"]

[project.scripts]
trsr1-bench = "trsr1.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
