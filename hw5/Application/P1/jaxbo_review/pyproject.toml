[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxbo-review"
version = "0.2.0"
description = "Native-JAX Bayesian optimization and configuration laboratories"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Carnegie Mellon University"}]
requires-python = ">=3.12,<3.13"
dependencies = [
  "hw5-bo-simulator-runtime==0.2.0",
  "jax==0.10.0",
]

[project.optional-dependencies]
test = ["pytest>=7,<9", "numpy>=1.26,<3", "scipy>=1.11,<2"]
plot = ["matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
include = ["jaxbo*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
