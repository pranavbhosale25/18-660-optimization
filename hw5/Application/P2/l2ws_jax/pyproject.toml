[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l2ws-jax-teaching"
version = "0.2.0"
description = "Functional JAX learning-to-warm-start homework with two nonconvex applications"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "jax>=0.12,<0.13",
  "optax>=0.2.8,<0.3",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.17,<0.18"]
cuda12 = ["jax[cuda12]>=0.12,<0.13"]
cuda13 = ["jax[cuda13]>=0.12,<0.13"]

[project.scripts]
l2ws-jax = "l2ws_jax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: exercises an accelerator backend when available"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PLR2004",
  "W291",
  "W292",
  "W293",
]

[tool.ruff.lint.per-file-ignores]
"examples/compare_precision.py" = ["E402"]
"examples/walkthrough.py" = ["E402"]
"scripts/check_problem.py" = ["E402"]
"tests/*.py" = ["PLR2004"]
