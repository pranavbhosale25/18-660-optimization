[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "geocomp-jax"
version = "0.2.0"
description = "Chance-constrained mesh compensation with JAX and Veinott supporting hyperplanes"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{name = "Carnegie Mellon University"}]
dependencies = [
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "ml-dtypes==0.6.0",
    "opt-einsum==3.4.0",
    "trimesh==5.2.0",
    "plotly==7.1.0",
]

[project.scripts]
geocomp = "geocomp.demo:main"
geocomp-demo = "geocomp.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geocomp*"]
