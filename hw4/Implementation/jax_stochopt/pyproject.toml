[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-stochopt"
version = "0.2.0"
description = "Composable, differentiable minibatch stochastic optimization in native JAX"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{name = "Carnegie Mellon University"}]
dependencies = [
    "jax==0.10.0",
    "jaxlib==0.10.0",
    "numpy==2.3.4",
    "scipy==1.17.1",
    "ml-dtypes==0.5.4",
    "opt-einsum==3.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

